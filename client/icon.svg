<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LifeLedger">
  <rect width="64" height="64" rx="12" fill="#1A211B"/>
  <path d="M15 18 22.5 45.5 32 26 41.5 45.5 49 18" fill="none" stroke="#F6F8F3" stroke-width="5.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The won sign's crossbars, drawn over the glyph and run to the edges so they read as ledger rules. -->
  <g stroke="#A6B9A0" stroke-width="3.6" stroke-linecap="butt">
    <path d="M0 30h64"/>
    <path d="M0 38.5h64"/>
  </g>
</svg>
