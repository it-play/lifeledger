<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <title>기록되지 않은 페이지 — LifeLedger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1A211B">
  <style>
    /* Standalone copy of the palette: this page ships without the stylesheet. */
    :root {
      --paper: #e9ede4;
      --paper-lit: #f6f8f3;
      --rule: #a6b9a0;
      --ink: #1a211b;
      --ink-soft: #5b6459;
      --deficit: #a32c2c;
      --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
    }

    body {
      box-sizing: border-box;
      max-width: 34rem;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
    }

    /* Lets the entry's parts space themselves on the body's flex layout. */
    .entry {
      display: contents;
    }

    .mark {
      margin: 0;
      font-family: var(--mono);
      font-size: 0.8125rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .ledger {
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 1rem;
      padding: 0.5rem 0.75rem;
    }

    .row.head {
      background: rgb(166 185 160 / 34%);
      border-bottom: 1px solid var(--rule);
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      color: var(--ink-soft);
    }

    .row.line {
      background: var(--paper-lit);
      padding-block: 1.25rem;
    }

    .label {
      font-size: 1.0625rem;
      font-weight: 600;
    }

    .amount {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--deficit);
    }

    .note {
      margin: 0;
      max-width: 28rem;
      color: var(--ink-soft);
      word-break: keep-all;
    }

    .back {
      align-self: start;
      padding: 0.625rem 1.125rem;
      background: var(--ink);
      color: var(--paper-lit);
      text-decoration: none;
      font-weight: 600;
    }

    .back:hover,
    .back:focus-visible {
      background: var(--deficit);
    }

    .back:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    /* Narrow screens are out of scope; send them to a desktop instead. */
    .narrow-gate {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }

    .narrow-gate h1 {
      margin: 0;
      font-size: 1.375rem;
      font-weight: 700;
      word-break: keep-all;
    }

    .narrow-gate p {
      margin: 0;
      color: var(--ink-soft);
      word-break: keep-all;
    }

    @media (width < 40rem) {
      .entry {
        display: none;
      }

      .narrow-gate {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <div class="entry">
    <p class="mark">LifeLedger</p>

    <div class="ledger">
      <div class="row head">
        <span>적요</span>
        <span>금액</span>
      </div>
      <div class="row line">
        <span class="label">기록되지 않은 페이지</span>
        <span class="amount">404</span>
      </div>
    </div>

    <p class="note">이 주소는 장부에 없습니다. 주소를 다시 확인하거나 대시보드에서 이어가세요.</p>

    <a class="back" href="/">대시보드로 가기</a>
  </div>

  <div class="narrow-gate">
    <p class="mark">LifeLedger</p>
    <h1>넓은 화면이 필요합니다</h1>
    <p>장부를 펼쳐 보는 화면이라 좁은 화면에서는 다루기 어렵습니다. PC 브라우저에서 열어 주세요.</p>
  </div>
</body>

</html>
