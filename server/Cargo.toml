[package]
name = "omega-dream-server"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
