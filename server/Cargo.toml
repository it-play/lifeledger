[package]
name = "lifeledger-server"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license-file = "../LICENSE"
publish = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
futures-core = "0.3.33"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "migrate", "time", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
sha2 = "0.10.9"
time = { version = "0.3.54", features = ["serde"] }
async-trait = "0.1.91"
utoipa = { version = "5.5.0", features = ["axum_extras", "repr"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
base64 = "0.23.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2", "form"] }
getrandom = "0.4.3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
