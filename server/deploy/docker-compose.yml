name: lifeledger

services:
  server:
    # 이 파일이 server/deploy/ 에 있으므로 빌드 컨텍스트는 server 루트다
    build: ..
    image: lifeledger-server:latest
    container_name: lifeledger-server
    restart: unless-stopped
    # 배포 시 통째로 갈아끼운다 (production 환경의 GitHub Secret SERVER_ENV)
    env_file:
      - app.env
    # nginx 만 붙는다. 외부에 직접 노출하지 않는다
    ports:
      - "127.0.0.1:10105:8080"
    # 호스트의 mysql 컨테이너(3306)를 host.docker.internal 로 부른다
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
