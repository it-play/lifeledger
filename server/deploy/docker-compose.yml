name: lifeledger

services:
  server:
    # 이 파일이 server/deploy/ 에 있으므로 빌드 컨텍스트는 server 루트다
    build: ..
    image: lifeledger-server:latest
    container_name: lifeledger-server
    restart: unless-stopped
    # 배포 시 통째로 갈아끼운다 (production 환경의 GitHub Secret SERVER_ENV)
    env_file:
      - app.env
    # nginx 만 붙는다. 외부에 직접 노출하지 않는다
    ports:
      - "127.0.0.1:10105:8080"
    # SQLx migrations use the MySQL container network directly; the host gateway stalls them.
    networks:
      - default
      - database
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  database:
    external: true
    name: readygsm-net
