version: 1.0

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 120

  AfterInstall:
    - location: scripts/build.sh
      timeout: 3000

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300

  ValidateService:
    - location: scripts/validate.sh
      timeout: 180

permissions:
  - object: /scripts
    pattern: "*.sh"
    mode: 755
    type:
      - file
