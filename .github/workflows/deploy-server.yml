name: Server Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kimtaeeun.site/lifeledger/api/health

    steps:
      - uses: actions/checkout@v7
      # 서버 디렉터리를 통째로 보낸다. env 만 시크릿에서 채워 넣는다.
      # 파일명이 .env 가 아닌 이유는 server/deploy/app.env.example 에 적어 두었다.
      - name: Prepare Deployment Package
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        run: printf '%s\n' "$SERVER_ENV" > server/deploy/app.env

      - name: Deploy to Server
        uses: 8G4B/GSM-SV-Deploy@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          user: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source_path: server
          target_path: /Users/snowykte0426/Downloads/lifeledger
          deployspec_path: server/deploy/deployspec.yml
